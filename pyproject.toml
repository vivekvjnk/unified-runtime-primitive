[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urp-core"
version = "0.1.0"
authors = [
    { name = "VHL Team" },
]
description = "Unified Runtime Primitive (URP) - Core implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]
