[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urp-core"
version = "0.1.0"
authors = [
    { name = "VHL Team" },
]
description = "Unified Runtime Primitive (URP) - Core implementation"
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "websockets>=11.0",
    "openhands-sdk[vertex]",
    "openhands-tools",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]
