<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>URP-HF | A2A Protocol Web Client</title>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <style>
            :root {
                --bg-color: #0b1120;
                --card-bg: #1e293b;
                --text-main: #f8fafc;
                --text-dim: #94a3b8;
                --primary: #38bdf8;
                --primary-hover: #0ea5e9;
                --accent: #10b981;
                --border: #334155;
                --console-bg: #020617;
                --danger: #ef4444;
                --warning: #f59e0b;
                --tool-bg: #0f172a;
            }
            * { box-sizing: border-box; }
            body { 
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                margin: 0; 
                background: var(--bg-color); 
                color: var(--text-main);
                display: flex;
                flex-direction: column;
                height: 100vh;
                overflow: hidden;
            }
            header {
                padding: 0.85rem 1.75rem;
                background: var(--card-bg);
                border-bottom: 1px solid var(--border);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            header h1 { margin: 0; font-size: 1.15rem; font-weight: 700; color: var(--primary); letter-spacing: -0.025em; }
            header .subtitle { font-size: 0.8rem; color: var(--text-dim); margin-left: 0.5rem; }
            
            main {
                display: grid;
                grid-template-columns: 360px 1fr;
                gap: 0;
                flex: 1;
                overflow: hidden;
            }

            #sidebar {
                background: var(--card-bg);
                border-right: 1px solid var(--border);
                padding: 1.25rem;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                gap: 1.25rem;
            }

            .config-section h3 { margin-top: 0; font-size: 0.8rem; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.05em; margin-bottom: 0.75rem; }
            .field-group { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 0.85rem; }
            label { font-size: 0.8rem; color: var(--text-dim); font-weight: 500; }
            
            select, input, textarea {
                background: var(--bg-color);
                border: 1px solid var(--border);
                color: var(--text-main);
                padding: 0.55rem;
                border-radius: 6px;
                font-size: 0.85rem;
                width: 100%;
            }
            select:focus, input:focus, textarea:focus {
                outline: 2px solid var(--primary);
                border-color: transparent;
            }

            button {
                background: var(--primary);
                color: #0b1120;
                border: none;
                padding: 0.55rem 0.9rem;
                border-radius: 6px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.15s ease;
                font-size: 0.85rem;
            }
            button:hover { background: var(--primary-hover); }
            button.secondary { background: var(--border); color: var(--text-main); }
            button.secondary:hover { background: #475569; }
            button.accent { background: var(--accent); color: white; }

            #content {
                display: flex;
                flex-direction: column;
                padding: 1.25rem;
                gap: 0.85rem;
                overflow: hidden;
            }

            #status-bar {
                background: var(--card-bg);
                padding: 0.65rem 1.25rem;
                border-radius: 8px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                border: 1px solid var(--border);
            }
            .status-badge {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                font-size: 0.85rem;
                font-weight: 500;
            }
            .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-dim); }
            .dot.online { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
            .dot.busy { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
            
            #console {
                flex: 1;
                background: var(--console-bg);
                border-radius: 8px;
                border: 1px solid var(--border);
                padding: 1.25rem;
                overflow-y: auto;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                font-size: 0.9rem;
                line-height: 1.6;
                display: flex;
                flex-direction: column;
                gap: 0.85rem;
            }
            
            /* High-Priority User and Agent Message Cards */
            .event {
                border-radius: 8px;
                padding: 0.85rem 1.15rem;
                max-width: 90%;
                word-wrap: break-word;
            }
            .event.user-msg {
                align-self: flex-end;
                background: #0284c7;
                color: #f8fafc;
                border-bottom-right-radius: 2px;
            }
            .event.agent-msg {
                align-self: flex-start;
                background: var(--card-bg);
                color: var(--text-main);
                border: 1px solid var(--border);
                border-bottom-left-radius: 2px;
            }
            .event.system-info {
                align-self: center;
                background: transparent;
                color: var(--text-dim);
                font-size: 0.75rem;
                padding: 0.25rem 0.5rem;
                text-align: center;
            }
            .event.error {
                align-self: center;
                background: rgba(239, 68, 68, 0.1);
                border: 1px solid var(--danger);
                color: #fca5a5;
                font-size: 0.85rem;
            }
            .event-time {
                color: rgba(255, 255, 255, 0.5);
                font-size: 0.7rem;
                margin-bottom: 0.25rem;
                display: block;
            }
            .event.agent-msg .event-time {
                color: var(--text-dim);
            }

            /* Collapsible Tool Call Summary Box */
            .tool-call-box {
                align-self: flex-start;
                background: var(--tool-bg);
                border: 1px solid var(--border);
                border-radius: 6px;
                margin: 0.25rem 0;
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
                font-size: 0.8rem;
                max-width: 85%;
            }
            .tool-call-box summary {
                padding: 0.45rem 0.75rem;
                cursor: pointer;
                color: var(--primary);
                font-weight: 500;
                display: flex;
                align-items: center;
                gap: 0.5rem;
                user-select: none;
            }
            .tool-call-box summary:hover {
                color: var(--primary-hover);
            }
            .tool-call-badge {
                background: rgba(56, 189, 248, 0.15);
                color: var(--primary);
                padding: 0.1rem 0.4rem;
                border-radius: 4px;
                font-size: 0.75rem;
            }
            .subtask-badge {
                background: rgba(16, 185, 129, 0.2);
                color: var(--accent);
                padding: 0.1rem 0.4rem;
                border-radius: 4px;
                font-size: 0.75rem;
            }
            .tool-call-content {
                padding: 0.5rem 0.75rem;
                border-top: 1px solid var(--border);
                color: var(--text-dim);
                max-height: 120px;
                overflow-y: auto;
                white-space: pre-wrap;
                font-size: 0.75rem;
                line-height: 1.4;
            }

            /* Markdown styling for rich responses */
            .markdown-body { font-size: 0.9rem; line-height: 1.6; }
            .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: var(--primary); margin-top: 0.6rem; margin-bottom: 0.3rem; }
            .markdown-body p { margin-bottom: 0.45rem; }
            .markdown-body code { background: #0b1120; padding: 0.15rem 0.35rem; border-radius: 4px; font-family: monospace; font-size: 0.85em; }
            .markdown-body pre { background: #020617; padding: 0.65rem; border-radius: 6px; overflow-x: auto; border: 1px solid var(--border); }
            .markdown-body pre code { background: transparent; padding: 0; }

            .input-area {
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
            }
            .input-container {
                display: flex;
                gap: 0.65rem;
            }
            textarea { resize: none; flex: 1; min-height: 70px; }

            /* Modal styling */
            .modal {
                display: none;
                position: fixed;
                z-index: 1000;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.7);
                backdrop-filter: blur(4px);
            }
            .modal-content {
                background: var(--card-bg);
                margin: 8% auto;
                padding: 1.5rem;
                width: 500px;
                border-radius: 10px;
                border: 1px solid var(--border);
                max-height: 75vh;
                display: flex;
                flex-direction: column;
            }
            #dirList { flex: 1; overflow-y: auto; margin: 1rem 0; border: 1px solid var(--border); border-radius: 6px; }
            .dir-item {
                padding: 0.6rem 0.85rem;
                cursor: pointer;
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }
            .dir-item:hover { background: var(--bg-color); }
        </style>
    </head>
    <body>
        <header>
            <div style="display:flex; align-items:center;">
                <h1>URP-HF</h1>
                <span class="subtitle">A2A Protocol Reference Web Client</span>
            </div>
            <div id="activeConvoInfo" style="display:none; font-size: 0.85rem; color: var(--text-dim);">
                A2A Context: <span id="activeConvId" style="color: var(--primary); font-family: monospace;"></span>
            </div>
        </header>

        <main>
            <div id="sidebar">
                <div class="config-section">
                    <h3>A2A Agent Card</h3>
                    <div class="field-group">
                        <label>Active Agent</label>
                        <select id="agentType" onchange="onAgentTypeChanged()">
                            <option value="">Discovering Agent Card...</option>
                        </select>
                        <span id="agentDescription" style="font-size: 0.75rem; color: var(--text-dim); margin-top: 0.25rem;"></span>
                    </div>
                    <div class="field-group">
                        <label>Workspace Path</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" id="workspacePath" value="./agent_workspace">
                            <button class="secondary" onclick="openPicker()" title="Browse directory">...</button>
                        </div>
                    </div>
                </div>

                <div id="conversationSection" class="config-section" style="display: none;">
                    <h3>Session Context</h3>
                    <div class="field-group">
                        <label>Resume Session</label>
                        <select id="resumeConversation" onchange="loadHistory()">
                            <option value="">-- New Session --</option>
                        </select>
                    </div>
                    <button class="secondary" style="width: 100%;" onclick="loadConversations()">Refresh Sessions</button>
                </div>

                <div style="margin-top: auto;">
                    <button style="width: 100%; padding: 0.75rem;" onclick="initAgent()">Deploy Agent</button>
                    
                    <div id="saveConvPanel" style="display:none; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border);">
                        <div class="field-group">
                            <label>Save Snapshot Name</label>
                            <input type="text" id="saveConvName" placeholder="e.g. analysis-checkpoint">
                        </div>
                        <button class="accent" style="width: 100%;" onclick="saveCurrentConversation()">Save Session</button>
                    </div>
                </div>
            </div>

            <div id="content">
                <div id="status-bar">
                    <div class="status-badge">
                        <div id="statusDot" class="dot"></div>
                        <span id="statusText">A2A Ready</span>
                        <span id="activeAgentBadge" style="margin-left: 0.75rem; padding: 0.2rem 0.5rem; background: var(--border); border-radius: 4px; font-size: 0.75rem; color: var(--primary); display: none;"></span>
                    </div>
                    <div id="protocolInfo" style="font-size: 0.85rem; color: var(--text-dim); font-family: monospace;">A2A v1.0 | HTTP+JSON / SSE</div>
                </div>

                <div id="console"></div>

                <div class="input-area">
                    <div class="input-container">
                        <textarea id="messageInput" placeholder="Enter message or prompt... (Ctrl+Enter to dispatch via A2A SSE)"></textarea>
                        <button id="sendBtn" onclick="sendMessageA2A()" style="padding: 0 1.25rem;">Send</button>
                    </div>
                </div>
            </div>
        </main>

        <div id="pickerModal" class="modal">
            <div class="modal-content">
                <h3 style="margin-top:0;">Select Workspace Directory</h3>
                <div id="currentBrowsePath" style="font-size: 0.8rem; color: var(--text-dim); word-break: break-all; margin-bottom: 0.5rem;"></div>
                <div id="dirList"></div>
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
                    <button class="secondary" onclick="closePicker()">Cancel</button>
                    <button onclick="selectCurrentDir()">Select Directory</button>
                </div>
            </div>
        </div>

        <script>
            const consoleDiv = document.getElementById('console');
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');
            const activeAgentBadge = document.getElementById('activeAgentBadge');
            let registeredAgents = [];
            let currentContextId = 'session-' + Math.random().toString(36).substring(2, 10);
            let activeStreamCard = null;
            let currentStreamText = '';

            function addLog(msg, type='event') {
                const div = document.createElement('div');
                div.className = 'event ' + type;
                const time = document.createElement('span');
                time.className = 'event-time';
                time.textContent = new Date().toLocaleTimeString();
                div.appendChild(time);
                
                const content = document.createElement('div');
                content.className = 'markdown-body';
                
                const rawMsg = typeof msg === 'string' ? msg : JSON.stringify(msg);
                if (type.includes('message') || type.includes('msg')) {
                    content.innerHTML = marked.parse(rawMsg);
                } else {
                    content.textContent = rawMsg;
                }
                div.appendChild(content);
                
                consoleDiv.appendChild(div);
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
                return div;
            }

            function getOrCreateStreamingAgentCard() {
                if (!activeStreamCard) {
                    activeStreamCard = addLog('', 'agent-msg');
                    currentStreamText = '';
                }
                return activeStreamCard;
            }

            function appendStreamingDelta(delta) {
                const card = getOrCreateStreamingAgentCard();
                currentStreamText += delta;
                const body = card.querySelector('.markdown-body');
                if (body) {
                    body.innerHTML = marked.parse(currentStreamText);
                }
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
            }

            function finalizeStreamingCard(fullText) {
                if (fullText) {
                    currentStreamText = fullText;
                }
                if (activeStreamCard) {
                    const body = activeStreamCard.querySelector('.markdown-body');
                    if (body) {
                        body.innerHTML = marked.parse(currentStreamText);
                    }
                } else if (fullText) {
                    addLog(fullText, 'agent-msg');
                }
                activeStreamCard = null;
                currentStreamText = '';
            }

            function addToolCallLog(toolName, argsStr, resultStr, isSubtask=false) {
                const details = document.createElement('details');
                details.className = 'tool-call-box';

                const summary = document.createElement('summary');
                const badge = document.createElement('span');
                badge.className = isSubtask ? 'subtask-badge' : 'tool-call-badge';
                badge.textContent = isSubtask ? `subtask: ${toolName}` : `tool: ${toolName}`;
                
                let paramPreview = '';
                if (typeof argsStr === 'object') {
                    paramPreview = JSON.stringify(argsStr);
                } else {
                    paramPreview = String(argsStr);
                }
                if (paramPreview.length > 60) {
                    paramPreview = paramPreview.substring(0, 60) + '...';
                }

                summary.appendChild(badge);
                summary.appendChild(document.createTextNode(` ${paramPreview}`));
                details.appendChild(summary);

                const body = document.createElement('div');
                body.className = 'tool-call-content';
                let formattedContent = `Arguments:\n${typeof argsStr === 'object' ? JSON.stringify(argsStr, null, 2) : argsStr}`;
                if (resultStr) {
                    let resFormatted = typeof resultStr === 'object' ? JSON.stringify(resultStr, null, 2) : resultStr;
                    const lines = resFormatted.split('\n');
                    if (lines.length > 8) {
                        resFormatted = lines.slice(0, 8).join('\n') + '\n... (truncated)';
                    }
                    formattedContent += `\n\nOutput:\n${resFormatted}`;
                }
                body.textContent = formattedContent;
                details.appendChild(body);

                consoleDiv.appendChild(details);
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
            }

            // 1. A2A Agent Card Discovery via /.well-known/agent.json
            async function discoverAgentCard() {
                try {
                    const res = await fetch('/.well-known/agent.json');
                    if (res.ok) {
                        const card = await res.json();
                        activeAgentBadge.textContent = `${card.name} v${card.version}`;
                        activeAgentBadge.style.display = 'inline-block';
                        document.getElementById('agentDescription').textContent = card.description;
                    }
                } catch (e) {
                    console.warn('Agent card discovery deferred:', e);
                }
            }

            async function loadAgentTypes() {
                try {
                    const res = await fetch('/agent/types');
                    registeredAgents = await res.json();
                    const select = document.getElementById('agentType');
                    select.innerHTML = '';
                    registeredAgents.forEach(agent => {
                        const opt = document.createElement('option');
                        opt.value = agent.id;
                        opt.textContent = `${agent.name} (${agent.id})`;
                        select.appendChild(opt);
                    });
                    onAgentTypeChanged();
                } catch (e) {
                    console.error('Failed loading agent types:', e);
                }
            }

            function onAgentTypeChanged() {
                const selId = document.getElementById('agentType').value;
                const agent = registeredAgents.find(a => a.id === selId);
                const descSpan = document.getElementById('agentDescription');
                if (agent && agent.description) {
                    descSpan.textContent = agent.description;
                } else {
                    descSpan.textContent = '';
                }
                const supportsHistory = (selId === 'sdk' || selId === 'pi_agent');
                document.getElementById('conversationSection').style.display = supportsHistory ? 'block' : 'none';
            }

            async function updateStatus() {
                try {
                    const res = await fetch('/agent/state');
                    const state = await res.json();
                    
                    statusText.textContent = state.status || 'Offline';
                    statusDot.className = 'dot';
                    if (state.status === 'PROCESSING') statusDot.classList.add('busy');
                    else if (state.status === 'WAITING') statusDot.classList.add('online');
                    else if (state.status === 'ERROR') statusDot.style.background = 'var(--danger)';

                    const activeId = state.active_conversation_id || currentContextId;
                    if (activeId && state.status !== 'OFFLINE') {
                        document.getElementById('activeConvoInfo').style.display = 'block';
                        document.getElementById('saveConvPanel').style.display = 'block';
                        document.getElementById('activeConvId').textContent = activeId.substring(0, 14);
                    }
                } catch (e) {
                    statusText.textContent = 'Connection Error';
                }
            }

            // 2. Dispatch Task via A2A Streaming Endpoint: POST /message:stream
            async function sendMessageA2A() {
                const input = document.getElementById('messageInput');
                const text = input.value.trim();
                if (!text) return;

                addLog(text, 'user-msg');
                input.value = '';
                const sendBtn = document.getElementById('sendBtn');
                sendBtn.disabled = true;

                const taskId = 'task-' + Math.random().toString(36).substring(2, 10);
                activeStreamCard = null;
                currentStreamText = '';

                statusDot.className = 'dot busy';
                statusText.textContent = 'A2A Streaming...';

                try {
                    const response = await fetch('/message:stream', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'text/event-stream'
                        },
                        body: JSON.stringify({
                            message: {
                                role: 'ROLE_USER',
                                contextId: currentContextId,
                                taskId: taskId,
                                parts: [{ text: text, mediaType: 'text/plain' }]
                            }
                        })
                    });

                    if (!response.ok) {
                        const err = await response.json();
                        addLog(`A2A Error: ${err.detail || response.statusText}`, 'error');
                        sendBtn.disabled = false;
                        updateStatus();
                        return;
                    }

                    // Read SSE stream using Fetch Streams API
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n\n');
                        buffer = lines.pop(); // keep remainder

                        for (const block of lines) {
                            if (!block.trim() || block.startsWith(':')) continue;
                            const dataLine = block.split('\n').find(l => l.startsWith('data: '));
                            if (!dataLine) continue;

                            const rawJson = dataLine.substring(6);
                            try {
                                const streamResp = JSON.parse(rawJson);
                                handleA2AStreamResponse(streamResp);
                            } catch (parseErr) {
                                console.error('Error parsing SSE json:', parseErr, rawJson);
                            }
                        }
                    }
                } catch (netErr) {
                    addLog(`Network Error during A2A turn: ${netErr}`, 'error');
                } finally {
                    sendBtn.disabled = false;
                    updateStatus();
                }
            }

            // 3. Process Inbound A2A Stream Responses
            function handleA2AStreamResponse(resp) {
                // Initial Task Snapshot
                if (resp.task) {
                    console.log('Task initialized:', resp.task.id);
                    return;
                }

                // Incremental Status / Event Update
                if (resp.statusUpdate) {
                    const su = resp.statusUpdate;
                    const meta = su.metadata || {};

                    // A. Text Delta streaming
                    if (meta.is_chunk && su.status?.message) {
                        const delta = su.status.message.parts?.[0]?.text || '';
                        appendStreamingDelta(delta);
                        return;
                    }

                    // B. Tool Call Event
                    if (meta.event_type === 'AGENT_TOOL_START') {
                        addToolCallLog(meta.toolName || 'tool', meta.args || {});
                        return;
                    } else if (meta.event_type === 'AGENT_TOOL_END') {
                        // Tool output handled inline
                        return;
                    }

                    // C. Sub-Task Delegation
                    if (meta.event_type === 'TASK_SUBTASK_STARTED') {
                        addToolCallLog('delegate', meta.args || meta, '', true);
                        return;
                    } else if (meta.event_type === 'TASK_SUBTASK_COMPLETED') {
                        addLog('Sub-task completed successfully', 'system-info');
                        return;
                    }

                    // D. Terminal States
                    if (su.status?.state === 'TASK_STATE_COMPLETED') {
                        const finalText = su.status.message?.parts?.[0]?.text;
                        finalizeStreamingCard(finalText);
                    } else if (su.status?.state === 'TASK_STATE_FAILED') {
                        const errText = su.status.message?.parts?.[0]?.text || 'Task failed';
                        addLog(errText, 'error');
                    }
                }

                // Direct Final Message
                if (resp.message && resp.message.parts) {
                    const text = resp.message.parts.map(p => p.text).filter(Boolean).join('\n');
                    finalizeStreamingCard(text);
                }
            }

            document.getElementById('messageInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    sendMessageA2A();
                }
            });

            async function initAgent() {
                const agentType = document.getElementById('agentType').value;
                const workspacePath = document.getElementById('workspacePath').value;
                const conversationId = document.getElementById('resumeConversation').value;

                addLog(`Deploying ${agentType} agent...`, 'system-info');
                const res = await fetch('/agent/init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        agent_type: agentType,
                        workspace_path: workspacePath,
                        conversation_id: conversationId || null
                    })
                });
                const data = await res.json();
                addLog(`Agent ready: ${data.agent_id}`, 'system-info');
                discoverAgentCard();
                updateStatus();
            }

            async function loadConversations() {
                const workspacePath = document.getElementById('workspacePath').value;
                const res = await fetch(`/agent/conversations?workspace_path=${encodeURIComponent(workspacePath)}`);
                const convs = await res.json();
                const select = document.getElementById('resumeConversation');
                const curVal = select.value;
                select.innerHTML = '<option value="">-- New Session --</option>';
                convs.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = `${c.name} (${c.id.substring(0,8)})`;
                    select.appendChild(opt);
                });
                if (curVal) select.value = curVal;
            }

            async function loadHistory() {
                const conversationId = document.getElementById('resumeConversation').value;
                const workspacePath = document.getElementById('workspacePath').value;
                if (!conversationId) return;

                consoleDiv.innerHTML = '';
                addLog(`Resumed session: ${conversationId}`, 'system-info');
                currentContextId = conversationId;
                try {
                    const res = await fetch(`/agent/conversations/history?workspace_path=${encodeURIComponent(workspacePath)}&conversation_id=${encodeURIComponent(conversationId)}`);
                    const history = await res.json();
                    history.forEach(item => {
                        addLog(item.text, item.role === 'user' ? 'user-msg' : 'agent-msg');
                    });
                } catch (e) {
                    addLog(`Error loading history: ${e}`, 'error');
                }
            }

            async function saveCurrentConversation() {
                const name = document.getElementById('saveConvName').value.trim();
                const workspacePath = document.getElementById('workspacePath').value;
                if (!name) { alert('Please enter a session name'); return; }

                const res = await fetch('/agent/conversations/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, workspace_path: workspacePath })
                });
                const data = await res.json();
                if (data.status === 'saved') {
                    addLog(`Session saved as '${name}'`, 'system-info');
                    document.getElementById('saveConvName').value = '';
                    loadConversations();
                } else {
                    alert(data.message || 'Failed to save session');
                }
            }

            let currentBrowsingPath = ".";
            const pickerModal = document.getElementById('pickerModal');
            const dirList = document.getElementById('dirList');
            const currentBrowsePathDiv = document.getElementById('currentBrowsePath');

            function openPicker() {
                pickerModal.style.display = 'block';
                browse(currentBrowsingPath);
            }
            function closePicker() {
                pickerModal.style.display = 'none';
            }

            async function browse(path) {
                const res = await fetch(`/agent/browse?path=${encodeURIComponent(path)}`);
                const data = await res.json();
                if (data.error) {
                    alert(data.error);
                    return;
                }
                currentBrowsingPath = data.current_path;
                currentBrowsePathDiv.textContent = currentBrowsingPath;
                dirList.innerHTML = '';
                data.items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'dir-item';
                    div.textContent = (item.is_dir ? '📁 ' : '') + item.name;
                    div.onclick = () => browse(item.path);
                    dirList.appendChild(div);
                });
            }

            function selectCurrentDir() {
                document.getElementById('workspacePath').value = currentBrowsingPath;
                closePicker();
                loadConversations();
            }

            // Initial load
            loadAgentTypes();
            discoverAgentCard();
            setInterval(updateStatus, 3000);
            setTimeout(loadConversations, 800);
        </script>
    </body>
</html>
