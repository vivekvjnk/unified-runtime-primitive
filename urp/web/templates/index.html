<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>URP-HF | Native A2A Protocol Web Client</title>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <link rel="stylesheet" href="/static/css/style.css">
    </head>
    <body>
        <header>
            <div class="header-left">
                <button class="toggle-sidebar-btn" onclick="toggleSidebar()" title="Toggle A2A Control Knobs">
                    ☰
                </button>
                <div style="display:flex; align-items:center;">
                    <h1>URP-HF</h1>
                    <span class="subtitle">Agent2Agent (A2A) Reference Client</span>
                </div>
            </div>
            <div style="display:flex; align-items:center; gap: 1rem;">
                <div style="font-size: 0.8rem; color: var(--text-dim); font-family: monospace;">
                    Task: <span id="headerTaskId" style="color: var(--primary);">none</span>
                </div>
                <div style="font-size: 0.8rem; color: var(--text-dim); font-family: monospace;">
                    Context: <span id="headerContextId" style="color: var(--primary);">auto</span>
                </div>
            </div>
        </header>

        <main>
            <!-- A2A Protocol Control Sidebar -->
            <aside id="sidebar">
                <!-- 1. Agent Discovery & Deployment -->
                <div class="config-section">
                    <h3>1. Agent Discovery & Deploy</h3>
                    <div class="field-group">
                        <label>Active Agent</label>
                        <select id="agentType" onchange="onAgentTypeChanged()">
                            <option value="">Discovering Agent Card...</option>
                        </select>
                        <span id="agentDescription" style="font-size: 0.72rem; color: var(--text-dim);"></span>
                    </div>
                    <div class="field-group">
                        <label>Workspace Path</label>
                        <div style="display: flex; gap: 0.4rem;">
                            <input type="text" id="workspacePath" value="./agent_workspace">
                            <button class="secondary" onclick="openPicker()" title="Browse Directory">📁</button>
                        </div>
                    </div>
                    <div class="btn-row">
                        <button onclick="initAgent()">Deploy Agent</button>
                        <button class="secondary" onclick="inspectAgentCard()" title="View full A2A Agent Card JSON">Card JSON</button>
                    </div>
                </div>

                <!-- 2. A2A Context & Identifiers -->
                <div class="config-section">
                    <h3>2. A2A Identifiers & Scope</h3>
                    <div class="field-group">
                        <label>Context ID (Session Anchor)</label>
                        <input type="text" id="customContextId" placeholder="Auto-generated context ID">
                    </div>
                    <div class="field-group">
                        <label>Task ID (Execution Anchor)</label>
                        <input type="text" id="customTaskId" placeholder="Auto-generated per task">
                    </div>
                    <div class="btn-row">
                        <button class="secondary" onclick="resetA2AContext()">New Context</button>
                        <button class="secondary" onclick="resetA2ATask()">New Task ID</button>
                    </div>
                </div>

                <!-- 3. A2A Task Control Knobs -->
                <div class="config-section">
                    <h3>3. A2A Task Operations</h3>
                    <div class="field-group">
                        <label>Target Task ID</label>
                        <input type="text" id="opTaskId" placeholder="Enter task-id to inspect/cancel">
                    </div>
                    <div class="btn-row">
                        <button class="secondary" onclick="queryTaskStatus()">Get Task</button>
                        <button class="danger" onclick="cancelCurrentTask()">Cancel Task</button>
                    </div>
                    <div class="btn-row" style="margin-top: 0.35rem;">
                        <button class="secondary" onclick="listHostTasks()">List Tasks</button>
                        <button class="secondary" onclick="attachTaskStream()">Re-Subscribe</button>
                    </div>
                </div>

                <!-- 4. Host Catalogs & Protocol Inspector -->
                <div class="config-section">
                    <h3>4. A2A Catalog & Discovery</h3>
                    <div class="btn-row">
                        <button class="secondary" onclick="inspectCatalog()">View Catalog</button>
                        <button class="secondary" onclick="clearConsole()">Clear Console</button>
                    </div>
                </div>
            </aside>

            <!-- Main Interactive Console & Chat Stream -->
            <section id="content">
                <div id="status-bar">
                    <div class="status-badge">
                        <div id="statusDot" class="dot"></div>
                        <span id="statusText">A2A Ready</span>
                        <span id="activeAgentBadge" style="margin-left: 0.5rem; padding: 0.15rem 0.5rem; background: var(--border); border-radius: 4px; font-size: 0.75rem; color: var(--primary); display: none;"></span>
                    </div>
                    <div id="protocolInfo" style="font-size: 0.8rem; color: var(--text-dim); font-family: monospace;">A2A v1.0 | HTTP+JSON / SSE</div>
                </div>

                <div id="console"></div>

                <div class="input-area">
                    <div class="input-controls-bar">
                        <div class="mode-selector">
                            <span style="font-weight:600; color:var(--text-dim);">A2A Dispatch Mode:</span>
                            <label>
                                <input type="radio" name="dispatchMode" value="stream" checked>
                                <span>Stream Turn (<code>/message:stream</code> SSE)</span>
                            </label>
                            <label>
                                <input type="radio" name="dispatchMode" value="sync">
                                <span>Sync Message (<code>/message:send</code>)</span>
                            </label>
                            <label>
                                <input type="radio" name="dispatchMode" value="async">
                                <span>Async Task (return_immediately)</span>
                            </label>
                        </div>
                        <div>
                            <span>Ctrl+Enter to Send</span>
                        </div>
                    </div>
                    <div class="input-container">
                        <textarea id="messageInput" placeholder="Enter instruction or message for the A2A agent..."></textarea>
                        <button id="sendBtn" onclick="dispatchA2ATurn()" style="padding: 0 1.5rem;">Send</button>
                    </div>
                </div>
            </section>
        </main>

        <!-- Inspector Modal (Agent Card, Tasks, Catalog) -->
        <div id="inspectorModal" class="modal">
            <div class="modal-content">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3 id="inspectorTitle" style="margin:0; color:var(--primary);">A2A Inspector</h3>
                    <button class="secondary" onclick="closeInspector()" style="padding:0.2rem 0.6rem;">✕</button>
                </div>
                <div class="modal-body">
                    <div id="inspectorJson" class="json-display"></div>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                    <button class="secondary" onclick="closeInspector()">Close</button>
                </div>
            </div>
        </div>

        <!-- Directory Picker Modal -->
        <div id="pickerModal" class="modal">
            <div class="modal-content">
                <h3 style="margin-top:0;">Select Workspace Directory</h3>
                <div id="currentBrowsePath" style="font-size: 0.8rem; color: var(--text-dim); word-break: break-all; margin-bottom: 0.5rem;"></div>
                <div id="dirList"></div>
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
                    <button class="secondary" onclick="closePicker()">Cancel</button>
                    <button onclick="selectCurrentDir()">Select Directory</button>
                </div>
            </div>
        </div>

        <!-- Modular App Script -->
        <script src="/static/js/app.js"></script>
    </body>
</html>
